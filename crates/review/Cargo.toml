[package]
name = "aurdeck-review"
description = "PKGBUILD fetching, diffs and review history for aurdeck"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[features]
# Derive `ts_rs::TS` on the types the desktop UI receives.
ts = ["dep:ts-rs"]

[dependencies]
serde = { version = "1", features = ["derive"] }
ts-rs = { version = "12", optional = true }
serde_json = "1"
tempfile = "3"
thiserror = "2"
aurdeck-core = { path = "../core" }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
