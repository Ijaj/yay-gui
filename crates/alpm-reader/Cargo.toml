[package]
name = "yaygui-alpm-reader"
description = "Read-only pacman/libalpm package database queries for YayGUI"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[features]
default = []
# Optional libalpm-backed implementation (needs libalpm; Arch only).
libalpm = ["dep:alpm"]

[dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"
regex = "1"
flate2 = "1"
tar = "0.4"
ruzstd = "0.9"
alpm = { version = "4", optional = true }

[dev-dependencies]
tempfile = "3"
zstd = "0.14"
