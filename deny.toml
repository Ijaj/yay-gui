# cargo-deny configuration (format version 2).
# Run locally with: cargo deny check
# CI runs the same checks through EmbarkStudios/cargo-deny-action.

[graph]
all-features = true

[advisories]
version = 2
# Vulnerabilities are denied by default in cargo-deny v2.
# Unmaintained crates are reported for workspace members only.
unmaintained = "workspace"
yanked = "warn"
ignore = []

[licenses]
version = 2
# Only licenses that are compatible with distributing a GPL-3.0-or-later binary.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "GPL-2.0-or-later",
    "GPL-3.0-or-later",
    "LGPL-2.0-or-later",
    "LGPL-2.1-or-later",
    "LGPL-3.0-or-later",
    "CC0-1.0",
    "0BSD",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
