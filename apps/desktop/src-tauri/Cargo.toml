[package]
name = "yaygui-desktop"
description = "YayGUI desktop app (Tauri 2)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[lib]
name = "yaygui_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros"] }
rustix = { version = "1", features = ["process"] }
yaygui-core = { path = "../../../crates/core" }
yaygui-aur-client = { path = "../../../crates/aur-client" }
yaygui-alpm-reader = { path = "../../../crates/alpm-reader" }
yaygui-yay-runner = { path = "../../../crates/yay-runner" }
